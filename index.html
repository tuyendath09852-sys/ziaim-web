.card{width:min(430px,100%);padding:28px;border-radius:24px;border:1px solid #1c3348;background:#0b1119;box-shadow:0 20px 70px #000b}
.logo{text-align:center;font-weight:900;font-size:28px;letter-spacing:3px;color:#00d9ff}
.sub{text-align:center;color:#7890a8;font-size:11px;letter-spacing:2px;margin:7px 0 25px}
label{font-size:12px;color:#9eb1c7;font-weight:700}
input{width:100%;margin-top:8px;padding:15px;border-radius:12px;border:1px solid #294158;background:#05080d;color:white;font-size:16px;outline:0}
button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:12px;background:#00cfff;color:#001018;font-weight:900;cursor:pointer}
#status{min-height:24px;text-align:center;margin-top:14px;font-size:13px;font-weight:800}
#profile{display:none;margin-top:20px;padding:18px;border:1px solid #245469;border-radius:16px;background:#07141b}
#profile h2{margin:0 0 8px;font-size:17px}
#profile p{font-size:12px;color:#91a8ba;line-height:1.5}
.install{display:block;text-align:center;padding:14px;border-radius:11px;background:#25e58b;color:#00150c;text-decoration:none;font-weight:900}
.note{margin-top:18px;text-align:center;font-size:10px;color:#536b81;line-height:1.5}
</style>
</head>

  <div class="logo">AIM</div>
  <div class="sub">TECHNOLOGY • SECURE ACCESS</div>

  <label>KEY BẢO MẬT</label>
  <input id="key" type="password" autocomplete="off" placeholder="Nhập Key để mở file">
  <button type="button">MỞ KHÓA</button>

  <div id="status"></div>

  <section id="profile">
    <h2>✓ MobileConfig đã được mở khóa</h2>
    <p>Key chính xác. Hồ sơ MobileConfig nằm ngay trong file này. Nhấn nút bên dưới để mở hồ sơ và thực hiện cài đặt trên iPhone/iPad.</p>
    <a id="install" class="install" href="#">MỞ & CÀI MOBILECONFIG</a>
  </section>

  <div class="note">TamMaoCuTo • Hồ sơ được nhúng trực tiếp trong file</div>
</main>

let profileURL = null;

function makeProfile() {
  const raw = atob(MOBILECONFIG);
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);

  const blob = new Blob([bytes], { type: "application/x-apple-aspen-config" });

  if (profileURL) URL.revokeObjectURL(profileURL);
  profileURL = URL.createObjectURL(blob);

  document.getElementById("openProfile").href = profileURL;
  document.getElementById("downloadProfile").href = profileURL;
}

function unlock() {
  const entered = document.getElementById("key").value.trim();
  const status = document.getElementById("status");
  const profile = document.getElementById("profile");

  if (entered !== ACCESS_KEY) {
    status.textContent = "✕ KHÔNG THÀNH CÔNG — KEY KHÔNG ĐÚNG";
    status.style.color = "#ff5f6d";
    profile.style.display = "none";
    return;
  }

  try {
    makeProfile();
    status.textContent = "✓ TamMaoCuTo — XÁC THỰC THÀNH CÔNG";
    status.style.color = "#25e58b";
    profile.style.display = "block";
  } catch (e) {
    status.textContent = "✕ Không thể tạo MobileConfig";
    status.style.color = "#ff5f6d";
    profile.style.display = "none";
    console.error(e);
  }
}

document.addEventListener("DOMContentLoaded", function () {
  const input = document.getElementById("key");
  const button = document.querySelector("button");

  button.type = "button";
  button.addEventListener("click", unlock);

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") unlock();
  });
});
</script>
